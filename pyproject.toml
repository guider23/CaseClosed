[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chargeback"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "pydantic",
    "pydantic-settings",
    "google-genai",
    "scikit-learn",
    "numpy",
    "pandas",
    "python-dotenv",
]

[tool.setuptools.packages.find]
where = ["src"]
